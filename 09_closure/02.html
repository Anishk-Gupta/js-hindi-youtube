<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>closure</title>
</head>
<body style="background-color: #313131;">
    <button id="green">green</button>
    <button id="orange">orange</button>
</body>
<script>
    // practical example hai closure ka phle 03.js dekhe

    // document.querySelector('#green').addEventListener('click',function(){
    //     document.body.style.backgroundColor = 'green'
    // })
    // document.querySelector('#orange').addEventListener('click',function(){
    //     document.body.style.backgroundColor = 'orange'
    // })

    function clickHandler(color){

        function inner(){
            document.body.style.backgroundColor = `${color}`
        }
        return inner
    }
    document.querySelector('#green').onclick = clickHandler('green')
    document.querySelector('#orange').onclick = clickHandler('orange')

</script>
</html>
